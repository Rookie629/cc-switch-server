# Nginx reverse proxy configuration for cc-switch-server
# Place at: /etc/nginx/sites-available/cc-switch-server
# Enable:   sudo ln -s /etc/nginx/sites-available/cc-switch-server /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx

upstream cc-switch-backend {
    server 127.0.0.1:9876;
    keepalive 32;
}

# HTTP → redirect to HTTPS (if using SSL)
server {
    listen 80;
    server_name cc-switch.example.com;

    # Uncomment to redirect HTTP to HTTPS:
    # return 301 https://$host$request_uri;

    # Or serve directly on HTTP (for internal/trusted networks):
    location / {
        proxy_pass http://cc-switch-backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

